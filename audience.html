<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aggregate Audience</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    <div class="flex flex-col h-screen">
        <!-- Header -->
        <div class="bg-white p-4 flex items-center border-b border-gray-200">
            <a href="main-feed.html" class="p-2">
                <svg viewBox="0 0 24 24" class="w-6 h-6 text-gray-600" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M19 12H5M12 19l-7-7 7-7"/>

            </a>
            <h1 class="text-xl font-bold flex-1 text-center">Aggregate Audience</h1>

        </div>

        <!-- Main Content -->
        <div class="flex-1 overflow-y-auto p-4">
            <div class="space-y-6">
                <!-- Following/Friends Grid -->
                <div class="grid grid-cols-2 gap-4">
                    <!-- Following Section -->
                    <div class="bg-white rounded-lg p-4">
                        <h2 class="font-semibold mb-3">Following</h2>
                        <div class="space-y-2">
                            <div class="flex items-center space-x-2">
                                <div class="w-8 h-8 rounded-full bg-green-100 flex items-center justify-center relative">

                                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>

                                </div>
                                <span class="text-green-600">user999</span>
                            </div>
                            <div class="flex items-center space-x-2">
                                <div class="w-8 h-8 rounded-full bg-gray-100 flex items-center justify-center">

                                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                                        <circle cx="12" cy="7" r="4"/>
                                    </svg>
                                </div>
                                <span class="text-gray-600">user212</span>
                            </div>
                        </div>
                    </div>

                    <!-- Friends Section -->
                    <div class="bg-white rounded-lg p-4">
                        <h2 class="font-semibold mb-3">Friends</h2>
                        <div class="space-y-2">
                            <div class="flex items-center space-x-2">
                                <div class="w-8 h-8 rounded-full bg-gray-100 flex items-center justify-center">
                                    <svg class="w-4 h-4 text-gray-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                                        <circle cx="12" cy="7" r="4"/>
                                    </svg>
                                </div>
                                <span class="text-gray-600">user789</span>
                            </div>
                            <div class="flex items-center space-x-2">
                                <div class="w-8 h-8 rounded-full bg-green-100 flex items-center justify-center relative">
                                    <svg class="w-4 h-4 text-green-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                                        <circle cx="12" cy="7" r="4"/>
                                    </svg>
                                    <div class="absolute bottom-0 right-0 w-2.5 h-2.5 bg-green-500 rounded-full border-2 border-white"></div>
                                </div>
                                <span class="text-green-600">user52</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Mood Indicator -->
                <div class="p-6 bg-white rounded-lg">
                    <div class="flex items-start space-x-4">
                        <svg viewBox="0 0 100 120" class="w-20 h-24" stroke="currentColor" fill="none" stroke-width="2">
                            <circle cx="50" cy="25" r="20"/>
                            <line x1="50" y1="45" x2="50" y2="85"/>
                            <line x1="50" y1="85" x2="30" y2="115"/>
                            <line x1="50" y1="85" x2="70" y2="115"/>
                            <line x1="20" y1="65" x2="80" y2="65"/>

                            <circle cx="58" cy="20" r="2" fill="currentColor"/>

                        </svg>
                        
                        <div>
                            <h3 class="font-semibold mb-1">Current mood:</h3>
                            <p class="text-gray-600">Happy</p>
                            <div class="mt-4">
                                <h4 class="font-semibold mb-1">Outliers:</h4>
                                <div class="space-y-1 text-gray-600">
                                    <div>user334 - Angry</div>
                                    <div>user556 - Distressed</div>
                                    <div>user778 - Melancholy</div>
                                </div>
                            </div>
                        </div>
