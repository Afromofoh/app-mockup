<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    <div class="flex flex-col h-screen">
        <!-- Top Bar -->
        <div class="bg-white p-4 flex justify-between items-center border-b border-gray-200">
            <button class="p-2">
                <svg viewBox="0 0 24 24" class="w-6 h-6 text-gray-600" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="3"/>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                </svg>
            </button>
            <button class="p-2">
                <svg viewBox="0 0 24 24" class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="8" cy="12" r="4"/>
                    <circle cx="16" cy="8" r="4"/>
                    <circle cx="16" cy="16" r="4"/>
                </svg>
            </button>
        </div>

        <!-- Profile Content -->
        <div class="flex-1 overflow-y-auto">
            <!-- Profile Header -->
            <div class="bg-white p-4 mb-4">
                <div class="flex items-center mb-4">
                    <div class="w-20 h-20 rounded-full bg-gray-200 mr-4"></div>
                    <div>
                        <h1 class="text-xl font-bold">Username</h1>
                        <p class="text-gray-500">@handle</p>
                    </div>
                </div>
                
                <!-- Bio Section -->
                <div class="mb-4">
                    <h2 class="font-semibold mb-2">Bio</h2>
                    <p class="text-gray-600">User bio text goes here...</p>
                </div>
                
                <div class="flex space-x-4 text-sm">
                    <div>
                        <span class="font-bold">250</span> following
                    </div>
                    <div>
                        <span class="font-bold">1.2k</span> followers
                    </div>
                </div>
            </div>

            <!-- Feed Section -->
            <div class="p-4">
                <h2 class="font-semibold mb-4">Feed</h2>
                <div class="grid grid-cols-2 gap-4">
                    <div class="aspect-square bg-white rounded-lg shadow"></div>
                    <div class="aspect-square bg-white rounded-lg shadow"></div>
                    <div class="aspect-square bg-white rounded-lg shadow"></div>
                    <div class="aspect-square bg-white rounded-lg shadow"></div>
                </div>
            </div>
        </div>

        <!-- Navigation -->
        <nav class="bg-white border-t border-gray-200 p-4">
            <div class="grid grid-cols-5 items-center relative">
                <a href="./" class="text-gray-500 text-center">Home</a>
                <a href="algorithm-arrays.html" class="text-gray-500 text-center">Algorithm</a>
                <a href="#" class="text-gray-500 text-center">Camera</a>
                <a href="search.html" class="text-gray-500 text-center">Search</a>
                <a href="mailman.html" class="text-gray-500 text-center">Mail</a>
            </div>
        </nav>
    </div>
</body>
</html>
