<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Algorithm Editor</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    <div class="flex flex-col h-screen">
        <!-- Header -->
        <div class="bg-white p-4 flex items-center border-b border-gray-200">
            <a href="algorithm-arrays.html" class="p-2">
                <svg viewBox="0 0 24 24" class="w-6 h-6 text-gray-600" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M19 12H5M12 19l-7-7 7-7"/>
                </svg>
            </a>
            <h1 class="text-xl font-bold flex-1 text-center">New Algorithm</h1>
            <div class="w-10"></div>
        </div>

        <!-- Main Content -->
        <div class="flex-1 overflow-y-auto p-4">
            <!-- People Section -->
            <div class="mb-6">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-lg font-semibold">People</h2>
                    <button class="text-blue-500 flex items-center">
                        <svg viewBox="0 0 24 24" class="w-5 h-5 mr-1" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="12" y1="5" x2="12" y2="19"></line>
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                        </svg>
                        Add
                    </button>
                </div>

                <div class="space-y-3">
                    <div class="bg-white p-4 rounded-lg flex items-center justify-between">
                        <div class="flex items-center">
                            <div class="w-8 h-8 rounded-full bg-gray-200 flex items-center justify-center">
                                <svg viewBox="0 0 24 24" class="w-4 h-4 text-gray-500" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                                    <circle cx="12" cy="7" r="4"/>
                                </svg>
                            </div>
                            <span class="ml-3">user123</span>
                        </div>
                        <div class="flex items-center space-x-4">
                            <div class="flex items-center space-x-2">
                                <button class="w-6 h-6 flex items-center justify-center bg-gray-100 rounded">-</button>
                                <span class="w-8 text-center">40</span>
                                <button class="w-6 h-6 flex items-center justify-center bg-gray-100 rounded">+</button>
                            </div>
                            <button class="text-gray-400">
                                <svg viewBox="0 0 24 24" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2">
                                    <line x1="18" y1="6" x2="6" y2="18"></line>
                                    <line x1="6" y1="6" x2="18" y2="18"></line>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <div class="bg-white p-4 rounded-lg flex items-center justify-between">
                        <div class="flex items-center">
                            <div class="w-8 h-8 rounded-full bg-gray-200 flex items-center justify-center">
                                <svg viewBox="0 0 24 24" class="w-4 h-4 text-gray-500" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                                    <circle cx="12" cy="7" r="4"/>
                                </svg>
                            </div>
                            <span class="ml-3">user456</span>
                        </div>
                        <div class="flex items-center space-x-4">
                            <div class="flex items-center space-x-2">
                                <button class="w-6 h-6 flex items-center justify-center bg-gray-100 rounded">-</button>
                                <span class="w-8 text-center">60</span>
                                <button class="w-6 h-6 flex items-center justify-center bg-gray-100 rounded">+</button>
                            </div>
                            <button class="text-gray-400">
                                <svg viewBox="0 0 24 24" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2">
                                    <line x1="18" y1="6" x2="6" y2="18"></line>
                                    <line x1="6" y1="6" x2="18" y2="18"></line>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <div class="bg-white p-4 rounded-lg flex items-center justify-between">
                        <div class="flex items-center">
                            <div class="w-8 h-8 rounded-full bg-gray-200 flex items-center justify-center">
                                <svg viewBox="0 0 24 24" class="w-4 h-4 text-gray-500" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                                    <circle cx="12" cy="7" r="4"/>
                                </svg>
                            </div>
                            <span class="ml-3">user789</span>
                        </div>
                        <div class="flex items-center space-x-4">
                            <div class="flex items-center space-x-2">
                                <button class="w-6 h-6 flex items-center justify-center bg-gray-100 rounded">-</button>
                                <span class="w-8 text-center">20</span>
                                <button class="w-6 h-6 flex items-center justify-center bg-gray-100 rounded">+</button>
                            </div>
                            <button class="text-gray-400">
                                <svg viewBox="0 0 24 24" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2">
                                    <line x1="18" y1="6" x2="6" y2="18"></line>
                                    <line x1="6" y1="6" x2="18" y2="18"></line>
                                </svg>
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Tags Section -->
            <div>
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-lg font-semibold">Tags</h2>
                    <button class="text-blue-500 flex items-center">
                        <svg viewBox="0 0 24 24" class="w-5 h-5 mr-1" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="12" y1="5" x2="12" y2="19"></line>
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                        </svg>
                        Add
                    </button>
                </div>

                <div class="space-y-3">
                    <div class="bg-white p-4 rounded-lg flex items-center justify-between">
                        <span>Max MSP</span>
                        <div class="flex items-center space-x-4">
                            <div class="flex items-center space-x-2">
                                <button class="w-6 h-6 flex items-center justify-center bg-gray-100 rounded">-</button>
                                <span class="w-8 text-center">70</span>
                                <button class="w-6 h-6 flex items-center justify-center bg-gray-100 rounded">+</button>
                            </div>
                            <button class="text-gray-400">
                                <svg viewBox="0 0 24 24" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2">
                                    <line x1="18" y1="6" x2="6" y2="18"></line>
                                    <line x1="6" y1="6" x2="18" y2="18"></line>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <div class="bg-white p-4 rounded-lg flex items-center justify-between">
                        <span>Ableton Live</span>
                        <div class="flex items-center space-x-4">
                            <div class="flex items-center space-x-2">
                                <button class="w-6 h-6 flex items-center justify-center bg-gray-100 rounded">-</button>
                                <span class="w-8 text-center">50</span>
                                <button class="w-6 h-6 flex items-center justify-center bg-gray-100 rounded">+</button>
                            </div>
                            <button class="text-gray-400">
                                <svg viewBox="0 0 24 24" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2">
                                    <line x1="18" y1="6" x2="6" y2="18"></line>
                                    <line x1="6" y1="6" x2="18" y2="18"></line>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <div class="bg-white p-4 rounded-lg flex items-center justify-between">
                        <span>user789</span>
                        <div class="flex items-center space-x-4">
                            <div class="flex items-center space-x-2">
                                <button class="w-6 h-6 flex items-center justify-center bg-gray-100 rounded">-</button>
                                <span class="w-8 text-center">30</span>
                                <button class="w-6 h-6 flex items-center justify-center bg-gray-100 rounded">+</button>
                            </div>
                            <button class="text-gray-400">
                                <svg viewBox="0 0 24 24" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2">
                                    <line x1="18" y1="6" x2="6" y2="18"></line>
                                    <line x1="6" y1="6" x2="18" y2="18"></line>
                                </svg>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Save Button -->
        <div class="p-4 bg-white border-t border-gray-200">
            <button class="w-full bg-blue-500 text-white py-3 rounded-lg font-medium">
                Save Algorithm
            </button>
        </div>
    </div>
</body>
</html>
